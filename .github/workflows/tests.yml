name: Tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  fidelity-policy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy<2" pillow opencv-python-headless
      - name: Compile changed modules
        run: >-
          python -m py_compile
          pipeline/body_lock.py
          pipeline/face_lock.py
          pipeline/garment_extract.py
          pipeline/leffa_sequential.py
          hf_space/app.py
          push_to_hf_space.py
      - name: Run fidelity policy tests
        run: python -m unittest discover -s tests -v
