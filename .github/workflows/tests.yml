name: Tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  fidelity-policy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy<2" pillow opencv-python-headless
      - name: Synchronize deployable Space pipeline
        run: python push_to_hf_space.py --sync-only
      - name: Verify Space pipeline has no drift
        run: git diff --exit-code -- hf_space/pipeline
      - name: Compile root and deployable modules
        run: >-
          python -m compileall -q
          pipeline
          hf_space/pipeline
          hf_space/app.py
          benchmark_fidelity.py
          push_to_hf_space.py
      - name: Run fidelity policy tests
        run: python -m unittest discover -s tests -v
